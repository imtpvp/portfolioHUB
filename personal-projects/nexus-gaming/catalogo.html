<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Nexus Gaming</title>
    <link rel="icon" href="img/favicon.ico"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <header class="bg-black text-white p-3 border-bottom border-danger">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="display-6">Catálogo de Lançamentos</h1>
            </div>
        <nav aria-label="Navegação Principal" class="mt-2">
            <a href="index.html" class="text-white me-3">Início</a>
            <a href="catalogo.html" class="text-white me-3">Catálogo</a>
            <a href="novidades.html" class="text-white">Novidades</a>
        </nav>
    </header>
    
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="p-3 bg-secondary rounded shadow-lg">
                    <h5 class="text-danger">Filtrar por Plataforma</h5>
                    <div id="filters" class="list-group">
                        <button class="list-group-item list-group-item-action active" data-filter="all">Todos</button>
                        <button class="list-group-item list-group-item-action" data-filter="ps5">PlayStation 5</button>
                        <button class="list-group-item list-group-item-action" data-filter="pc">PC</button>
                        <button class="list-group-item list-group-item-action" data-filter="xbox">Xbox Series X/S</button>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row row-cols-1 row-cols-md-3 g-4" id="games-container">
                    </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
